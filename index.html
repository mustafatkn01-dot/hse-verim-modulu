<style>
html.yukleniyor body>*:not(#acilis):not(#toast){visibility:hidden}
#acilis{--sp-bg:#EDF2F0;--sp-ink:#10201C;--sp-mut:#546964;--g:#17A06F;--g2:#7FD1B0;--bl:#2A82C4;position:fixed;inset:0;z-index:99990;display:flex;align-items:center;justify-content:center;background:var(--sp-bg);color:var(--sp-ink);transition:opacity .5s;font-family:Manrope,Arial,sans-serif}
:root[data-theme="dark"] #acilis{--sp-bg:#0d1a22;--sp-ink:#e8f0ee;--sp-mut:#9bb0ba;--g:#1FBF86;--g2:#8FE0C4}
@media (prefers-color-scheme:dark){:root[data-theme="auto"] #acilis{--sp-bg:#0d1a22;--sp-ink:#e8f0ee;--sp-mut:#9bb0ba;--g:#1FBF86;--g2:#8FE0C4}}
#acilis.out{opacity:0;pointer-events:none}
#acilis .sp{position:relative;width:min(300px,70vw);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
#acilis .lg{width:42%;aspect-ratio:1;border-radius:22%;box-shadow:0 8px 26px rgba(11,34,48,.25);animation:spPop .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes spPop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
#acilis .orb{position:absolute;inset:0;animation:spSpin 2.4s linear infinite}
@keyframes spSpin{to{transform:rotate(360deg)}}
#acilis .orb i{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);border-radius:50%;background:var(--c);opacity:var(--o);transform:rotate(var(--a)) translateY(calc(-1 * var(--r)))}
#acilis .rg{position:absolute;inset:6%;border-radius:50%;border:1px dashed color-mix(in srgb,var(--bl) 35%,transparent)}
#acilis .pl{position:absolute;width:56%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--g) 22%,transparent),transparent 70%);animation:spPulse 2.4s ease-in-out infinite}
@keyframes spPulse{50%{transform:scale(1.12);opacity:.55}}
#acilis .nm{position:absolute;bottom:-40px;left:0;right:0;text-align:center;font:700 15px Sora,Arial,sans-serif;letter-spacing:.2px}
#acilis .nm small{display:block;margin-top:3px;font:400 11px Manrope,Arial,sans-serif;color:var(--sp-mut)}
@media (prefers-reduced-motion:reduce){#acilis .orb{animation-duration:6s}}
</style>
<script>
/* Açılış ekranı: ilk ekran (giriş / uygulama) hazır olana kadar logo ve dönen yeşil noktalar; kayıtlı tema en baştan uygulanır */
(function(){var h=document.documentElement,t0=Date.now(),bitti=false;h.classList.add('yukleniyor');
try{var t=localStorage.getItem('hse_theme');if(t==='light'||t==='dark'||t==='auto')h.dataset.theme=t}catch(e){}
function bitir(){if(bitti)return;bitti=true;setTimeout(function(){var a=document.getElementById('acilis');h.classList.remove('yukleniyor');if(a){a.classList.add('out');setTimeout(function(){a.remove()},600)}},Math.max(0,800-(Date.now()-t0)))}
function bak(){return document.querySelector('#app:not(.hide), #login:not(.hide), #guestReq:not(.hide)')}
document.addEventListener('DOMContentLoaded',function(){if(bak())return bitir();new MutationObserver(function(m,o){if(bak()){o.disconnect();bitir()}}).observe(document.body,{attributes:true,attributeFilter:['class'],subtree:true})});
setTimeout(bitir,6000)})();
</script>

<script>
// Açılış bekçisi: uygulama birkaç saniyede açılmazsa beyaz ekran yerine hata özeti ve yenile düğmesi gösterir
(function () {
  var last = "";
  var note = function (m) { last = String(m || "").slice(0, 300); };
  addEventListener("error", function (e) { note((e.message || "Hata") + (e.filename ? " · " + e.filename.split("/").pop() + ":" + e.lineno : "")); });
  addEventListener("unhandledrejection", function (e) { note(e.reason && (e.reason.message || e.reason)); });
  setTimeout(function () {
    var ok = document.querySelector("#app:not(.hide), #login:not(.hide), #guestReq:not(.hide)");
    var any = document.querySelector("section:not(.hide), #app:not(.hide)");
    if (ok || any) return;
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#EDF2F0;z-index:99999;font-family:system-ui,sans-serif";
    d.innerHTML = '<div style="max-width:420px;background:#fff;border:1px solid #C3D1CC;border-radius:16px;padding:22px;color:#10201C"><b style="font-size:18px">Uygulama açılamadı</b><p style="line-height:1.5;color:#546964">Sayfa tam yüklenemedi. Güncelleme yeni yayınlanmış olabilir; bir dakika bekleyip yenileyin.</p><p style="font-size:12px;color:#8E1B16;word-break:break-word">' + (last ? "Hata: " + last.replace(/[<>&]/g, "") : "Hata bilgisi alınamadı (ağ veya yükleme sorunu olabilir).") + '</p><button onclick="location.reload()" style="height:44px;padding:0 20px;border-radius:12px;background:#0B6E4F;color:#fff;font-weight:700;border:0">Yenile</button></div>';
    document.body.appendChild(d);
  }, 9000);
})();
</script>
