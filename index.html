<!doctype html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSE Verim Modülü</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B2230">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HSE Verim">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=20261012n">
</head>
<body>
<section id="login" class="hide">
  <form class="box" id="loginForm">
    <div class="stripe" style="border-radius:4px;overflow:hidden;margin-bottom:18px"><i></i><i></i><i></i><i></i></div>
    <div class="brand" style="margin-bottom:6px"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></div>
      <div><h1 style="font-size:20px">HSE Verim Modülü</h1><span class="muted" style="font-size:12px">Performans Takip</span></div></div>
    <label>E-posta</label><input type="email" id="em" autocomplete="username" required>
    <label>Şifre</label><input type="password" id="pw" autocomplete="current-password" minlength="6" required>
    <label style="display:flex;align-items:center;gap:8px;margin:8px 0 0;font-weight:600;cursor:pointer"><input type="checkbox" id="showPw" style="width:auto;height:auto"> Şifreyi göster</label>
    <div class="err" id="loginErr"></div>
    <div class="row"><button type="submit">Giriş yap</button>
      <button type="button" class="sec" id="btnReset">Şifremi unuttum</button><button type="button" class="sec" id="btnLink">E-posta bağlantısıyla giriş</button></div>
  </form>
</section>
<div id="app" class="hide">
  <div id="mbar"><button id="menuBtn" aria-label="Menüyü aç"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div class="brand"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></div><div><b style="color:#fff">HSE Verim Modülü</b><small>Performans Takip</small></div></div></div>
  <div id="ov"></div>
  <aside id="side"><div class="stripe"><i></i><i></i><i></i><i></i></div><div class="in" id="nav"></div></aside>
  <div class="pg">
    <div class="ctx"><select id="selFactory" aria-label="Fabrika"></select><select id="selYear" aria-label="Yıl"></select></div>
    <div id="view" style="display:flex;flex-direction:column;gap:22px"></div>
  </div>
</div>
<div id="toast"></div>
<script>
// Açılış bekçisi: uygulama birkaç saniyede açılmazsa beyaz ekran yerine hata özeti ve yenile düğmesi gösterir
(function () {
  var last = "";
  var note = function (m) { last = String(m || "").slice(0, 300); };
  addEventListener("error", function (e) { note((e.message || "Hata") + (e.filename ? " · " + e.filename.split("/").pop() + ":" + e.lineno : "")); });
  addEventListener("unhandledrejection", function (e) { note(e.reason && (e.reason.message || e.reason)); });
  setTimeout(function () {
    var ok = document.querySelector("#app:not(.hide), #login:not(.hide), #guestReq:not(.hide)");
    var any = document.querySelector("section:not(.hide), #app:not(.hide)");
    if (ok || any) return;
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#EDF2F0;z-index:99999;font-family:system-ui,sans-serif";
    d.innerHTML = '<div style="max-width:420px;background:#fff;border:1px solid #C3D1CC;border-radius:16px;padding:22px;color:#10201C"><b style="font-size:18px">Uygulama açılamadı</b><p style="line-height:1.5;color:#546964">Sayfa tam yüklenemedi. Güncelleme yeni yayınlanmış olabilir; bir dakika bekleyip yenileyin.</p><p style="font-size:12px;color:#8E1B16;word-break:break-word">' + (last ? "Hata: " + last.replace(/[<>&]/g, "") : "Hata bilgisi alınamadı (ağ veya yükleme sorunu olabilir).") + '</p><button onclick="location.reload()" style="height:44px;padding:0 20px;border-radius:12px;background:#0B6E4F;color:#fff;font-weight:700;border:0">Yenile</button></div>';
    document.body.appendChild(d);
  }, 9000);
})();
</script>
<script type="module" src="js/app.js?v=20261012n"></script>
</body>
</html>
