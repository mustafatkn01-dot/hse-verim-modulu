<!doctype html>
<html lang="tr" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSE Verim Modülü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<section id="login" class="hide">
  <form class="box" id="loginForm">
    <h1>HSE Verim Modülü</h1>
    <p class="muted">Devam etmek için giriş yapın.</p>
    <label>E-posta</label><input type="email" id="em" autocomplete="username" required>
    <label>Şifre</label><input type="password" id="pw" autocomplete="current-password" minlength="6" required>
    <div class="err" id="loginErr"></div>
    <div class="row"><button type="submit">Giriş yap</button>
      <button type="button" class="sec" id="btnReset">Şifremi unuttum</button></div>
    <p class="muted" style="font-size:12px;margin-bottom:0">Hesap yönetici tarafından oluşturulur.</p>
  </form>
</section>
<div id="app" class="hide">
  <nav id="nav"></nav>
  <main>
    <div class="top">
      <select id="selFactory" aria-label="Fabrika"></select>
      <select id="selYear" aria-label="Yıl"></select>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="toast"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
